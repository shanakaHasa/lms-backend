[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "teachassist-backend"
version = "0.1.0"
description = "LMS service: students, courses, materials, RAG, and the agent"
requires-python = ">=3.12"

# Base dependencies only. The RAG and agent stacks are optional extras so the
# early steps install in seconds and nothing unverifiable is pulled in before
# the step that needs it.
dependencies = [
  # web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1",
  # database
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  # token verification (this service verifies, it never issues)
  "pyjwt[crypto]>=2.9",
  "cryptography>=43.0",
  "httpx2>=0.28",
  # observability
  "structlog>=24.4",
  # cli
  "typer>=0.15",
]

[project.optional-dependencies]
# Added at step B5.
rag = [
  "openai>=1.55",
  "pinecone>=5.3",
  "pymupdf>=1.24",
  "python-docx>=1.1",
]
# Added at step B6. Pinned <3 for the same reason as auth-backend: the SDK major
# must match the server major, and a v2 server is one container.
agent = [
  "langgraph>=0.2.60",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.3",
  "langfuse>=2.53,<3",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "freezegun>=1.5",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
teachassist-backend = "app.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "C4", "RUF", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Same reasoning as auth-backend: these names mirror HTTP semantics rather than
# Python's Error-suffix convention, and NotFoundError reads worse than NotFound.
"app/core/errors.py" = ["N818"]
"tests/*" = ["S105", "S106", "S107"]
"app/cli.py" = ["T20"]
"scripts/*" = ["T20"]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests need a real Postgres and are skipped by default, so a
# `pytest` on a laptop runs green with nothing installed. Phase 2 and CI run
# them explicitly with `pytest -m integration` once `alembic upgrade head` has
# been applied.
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
  "integration: needs a real Postgres",
  "serial: needs real commits, cannot run under transaction rollback",
]
